services:
  - type: web
    name: quickpress-api
    runtime: python
    # Python version is pinned by backend-python/runtime.txt (python-3.12.12).
    # Render must NOT pick 3.14: pydantic-core has no 3.14 wheel and falls back
    # to a Rust/maturin source build that fails.
    pythonVersion: "3.12.12"
    rootDir: backend-python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    # FastAPI is ASGI — it must be served by uvicorn, never gunicorn/wsgi.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.12
      # --- secrets: set the real values in the Render dashboard -----------
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quickpress
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Frontends. Each is a TanStack Start SSR app => Render **Web Service**, never
  # a Static Site. NITRO_PRESET=node-server makes the existing Nitro/TanStack
  # build emit a plain Node server at .output/server/index.mjs (verified
  # locally: build + start + HTTP 200 on all routes). Lovable preview builds are
  # unaffected — they ignore NITRO_PRESET and keep the Cloudflare target.
  # ---------------------------------------------------------------------------
  - type: web
    name: quickpress-customer
    runtime: node
    rootDir: customer-frontend
    plan: starter
    region: singapore
    buildCommand: npm install && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /home
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

  - type: web
    name: quickpress-partner
    runtime: node
    rootDir: partner-frontend
    plan: starter
    region: singapore
    buildCommand: npm install && NITRO_PRESET=node-server npm run build
